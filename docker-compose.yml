
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: employee_management
    volumes:
      - ./Backend/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./Backend
    image: employee-backend
    container_name: employee-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: employee_management
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./Frontend
    image: employee-frontend
    container_name: employee-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
