services:
  backend:
    build: ./Backend
    image: employee-backend
    container_name: employee-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    restart: always

  frontend:
    build: ./Frontend
    image: employee-frontend
    container_name: employee-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
