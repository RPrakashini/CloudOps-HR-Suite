
name: Employee Management - CI Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: employee_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Create test database table
        working-directory: Backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: employee_management
        run: |
          node -e "
          const fs = require('fs');
          const mysql = require('mysql2');
          const db = mysql.createConnection({
            host: process.env.DB_HOST,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            database: process.env.DB_NAME
          });
          db.query(fs.readFileSync('schema.sql', 'utf8'), (err) => {
            if (err) throw err;
            console.log('Employee table created');
            db.end();
          });
          "

      - name: Start backend server
        working-directory: Backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: employee_management
        run: |
          npm start > backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/; then
              echo "Backend started successfully"
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Run employee API tests
        working-directory: Backend
        env:
          API_URL: http://127.0.0.1:5000
        run: node test-api.js

      - name: Build backend Docker image
        run: docker build -t employee-backend:ci ./Backend

      - name: Build frontend Docker image
        run: docker build -t employee-frontend:ci ./Frontend
