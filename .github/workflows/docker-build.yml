name: Employee Management - Docker Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t employee-backend:ci ./Backend

      - name: Build frontend Docker image
        run: docker build -t employee-frontend:ci ./Frontend
