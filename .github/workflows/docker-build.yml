
name: CloudOps HR Suite - CI Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and start all containers
        run: docker compose up --build -d

      - name: Wait for application to become ready
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1/employees; then
              echo "Application is ready!"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to become ready"
          docker compose logs
          exit 1

      - name: Run employee API integration tests
        working-directory: Backend
        env:
          API_URL: http://127.0.0.1
        run: node test-api.js

      - name: Display running containers
        run: docker compose ps

      - name: Display logs if pipeline fails
        if: failure()
        run: docker compose logs

      - name: Stop and remove containers
        if: always()
        run: docker compose down --volumes --remove-orphans
